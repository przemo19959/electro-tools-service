name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Setup Java JDK
            uses: actions/setup-java@v5.2.0
            with:
                java-version: 25
                distribution: corretto
                cache: 'maven'

          - name: build project
            run: mvn clean package
          
            
          
